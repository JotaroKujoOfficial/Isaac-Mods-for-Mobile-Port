name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z"; done
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")
          cd "$DIR"
          gradle assembleDebug --no-daemon
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find . -name "app-debug.apk" | head -1)
          cp "$APK" IsaacMods.apk
          gh release create "v${{ github.run_number }}" IsaacMods.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Моды Isaac v${{ github.run_number }}" \
            --notes "APK-файл для установки на Android"

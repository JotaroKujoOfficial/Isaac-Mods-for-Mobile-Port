name: Build APK
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect mods
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z"; done
          python3 "$(find . -name crawl.py -path '*crawler*' | head -1)" catalog.json
      - name: Commit catalog
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add catalog.json
          git add icons 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update catalog" && git push)
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z"; done
          sed -i "s#ВАШ_НИК/ВАШ_РЕПО/main#${{ github.repository }}/${{ github.event.repository.default_branch }}#" "$(find . -name MainActivity.kt | head -1)"
          M=$(dirname "$(find . -name AndroidManifest.xml -path '*src/main*' | head -1)")
          mkdir -p "$M/assets"
          if [ -f header_art.png ]; then cp header_art.png "$M/assets/header_art.png"; fi
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")
          cd "$DIR"
          gradle assembleDebug --no-daemon
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find . -name "app-debug.apk" | head -1)
          cp "$APK" IsaacMods.apk
          gh release create "v${{ github.run_number }}" IsaacMods.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Моды Isaac v${{ github.run_number }}" \
            --notes "APK-файл для установки на Android"
